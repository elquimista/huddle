# Second local homeserver that signs in through OAuth (Matrix Authentication Service),
# like matrix.org does. Start it with ./setup.sh.
#   Synapse: http://localhost:8009     MAS: http://localhost:8081
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas"]
      interval: 2s
      retries: 30

  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:latest
    restart: unless-stopped
    command: ["server"]
    environment:
      MAS_CONFIG: /data/config.yaml:/data/override.yaml
    volumes:
      - ./data/mas:/data
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  synapse:
    image: ghcr.io/element-hq/synapse:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8009:8008"
    volumes:
      - ./data/synapse:/data
    environment:
      SYNAPSE_SERVER_NAME: oauth.localhost
      SYNAPSE_REPORT_STATS: "no"
    depends_on:
      - mas
