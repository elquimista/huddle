# LiveKit, the call server Element Call talks to, for testing calls in "Huddle Dev".
# Its media reaches the Mac through these ports, announced as localhost.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50120
  use_external_ip: false
  node_ip: 127.0.0.1
# Dev-only key pair, shared with lk-jwt-service below. Never used anywhere else.
keys:
  devkey: huddle-dev-livekit-secret-not-for-production
