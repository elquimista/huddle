# Builds the release app for every pushed tag and publishes it as a GitHub release for that tag.
# A tag like v1.2.0 stamps version 1.2.0; a tag with a hyphen (v1.3.0-beta1) makes a pre-release.
#
# Matrix SDK: Element only publishes it prebuilt for iOS, so it is compiled here from source
# (Scripts/build-sdk.sh) and cached. The first run, and the first after the SDK commit in that script
# changes, takes far longer than the rest.
#
# Signing: with the MACOS_CERTIFICATE_P12 (base64 of an exported .p12 with a Developer ID
# Application certificate and its key) and MACOS_CERTIFICATE_PASSWORD secrets set, the app is signed
# with that certificate, so it keeps its Team ID and the Keychain doesn't ask again after updating.
# An Apple Development certificate does too, but Gatekeeper turns it away on other Macs. Without
# them it is signed ad hoc: a new identity every build, which the Keychain and the microphone
# permission don't recognise, so they ask again.
#
# Notarization: with the NOTARY_API_KEY (base64 of an App Store Connect API key's .p8),
# NOTARY_KEY_ID and NOTARY_ISSUER_ID secrets set too, a Developer ID build is sent to Apple to be
# checked and the ticket stapled to it, so Gatekeeper opens it on any Mac without asking.
#
# Trial run: Run workflow, on the Actions tab, builds, signs and notarizes as a release would, and
# keeps the archive with the run for three days, published nowhere: to try the secrets.
#
# Updates: with the SPARKLE_PRIVATE_KEY and RELEASES_TOKEN secrets set, each release is signed for
# Sparkle and published, with the appcast the app checks, to a repository of releases of its own
# (the UPDATES_REPO variable, else <owner>/huddle-releases). Only there: this repository gets no
# release of its own. Without the secrets the release is published here instead, and isn't offered
# as an update.
#
# Release notes: the tag's own message (git tag -a): its first line the release's title, the rest
# what's new, as paragraphs and "- " lists (Scripts/release-notes.py), shown on the release and in
# the update window. A tag without a message gets the commits since the last release instead.
#
# The release environment: the job runs in it (Settings > Environments > release), and every secret
# above is one of its own, not the repository's. Set up as the README says (Releases), it lets only
# the release tags and the release branches in, and waits for its reviewer to approve each run, so
# no one who can merely push here (or a token that can) gets a signed release published.
#
# The app is one for both Apple Silicon and Intel Macs.
name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    # Its secrets are the release environment's: a run waits there for approval before it starts.
    environment: release
    env:
      UPDATES_REPO: ${{ vars.UPDATES_REPO || format('{0}/huddle-releases', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits
          # Nothing here pushes to this repository, so its token isn't left in .git/config for the
          # SDK's build scripts and everything else that runs after.
          persist-credentials: false

      - name: Work out the version
        run: |
          # The tag's (v1.2.0 stamps 1.2.0); a trial run's, the latest tag's, marked as a trial.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' | sed 's/^v//')-trial"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # What's new: the tag's own message, or the commits since the last release (the last stable
      # one, for a stable release) but not those that only change how releases are made. Read
      # from GitHub, as the checkout leaves a tag without its message. Here, before the build, so
      # a tag GitHub can't tell about stops the run in a minute rather than an hour.
      - name: Write the release notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exclude="--exclude=*-*"
          case "$GITHUB_REF_NAME" in *-*) exclude="" ;; esac
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' $exclude "$GITHUB_REF_NAME^" 2> /dev/null || true)"
          git log --no-merges --format=%s "${previous:+$previous..}$GITHUB_REF_NAME" -- . ':(exclude).github' > "$RUNNER_TEMP/changes.txt"
          for attempt in 1 2 3 4 5; do
            if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')"; then break; fi
            [ "$attempt" = 5 ] && { echo "::error::GitHub didn't say what the tag is."; exit 1; }
            sleep $((attempt * 10))
          done
          : > "$RUNNER_TEMP/tag.txt"
          if [ "${object%% *}" = tag ]; then
            for attempt in 1 2 3 4 5; do
              if gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#* }" --jq .message > "$RUNNER_TEMP/tag.txt"; then break; fi
              [ "$attempt" = 5 ] && { echo "::error::GitHub didn't give the tag's message."; exit 1; }
              sleep $((attempt * 10))
            done
          fi
          Scripts/release-notes.py "$RUNNER_TEMP/tag.txt" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/title.txt"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::The tag has no message beyond its title: the release lists the commits instead."
            sed 's/^/- /' "$RUNNER_TEMP/changes.txt" > "$RUNNER_TEMP/notes.md"
          fi
          [ -s "$RUNNER_TEMP/title.txt" ] || echo "Huddle $VERSION" > "$RUNNER_TEMP/title.txt"
          echo "RELEASE_TITLE=$(head -1 "$RUNNER_TEMP/title.txt")" >> "$GITHUB_ENV"
          { echo "### $(head -1 "$RUNNER_TEMP/title.txt")"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Use the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Restore the Matrix SDK
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/MatrixRustSDK/MatrixSDKFFI.xcframework
            Vendor/MatrixRustSDK/Sources
          # A new SDK commit or a changed patch to its dependencies makes a new build.
          key: matrix-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-sdk.sh', 'Scripts/sdk-patches/**') }}

      - name: Build the Matrix SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          Scripts/build-sdk.sh

      # Kept as soon as it's built, not only once the whole job has gone well: a release that fails
      # later on (a GitHub hiccup while publishing, say) and is run again then takes minutes, not
      # another hour. A cache belongs to the tag it was made for, so it serves that tag's re-runs.
      - name: Keep the Matrix SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/MatrixRustSDK/MatrixSDKFFI.xcframework
            Vendor/MatrixRustSDK/Sources
          key: ${{ steps.sdk.outputs.cache-primary-key }}

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::warning::No MACOS_CERTIFICATE_P12 secret: the app will be signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build
        run: |
          HUDDLE_VERSION="$VERSION" HUDDLE_UPDATES_REPO="$UPDATES_REPO" Scripts/build-app.sh
          ditto -c -k --keepParent build/Huddle.app "Huddle-$VERSION.zip"

      # Apple's check of a Developer ID build, so Gatekeeper opens it on any Mac without asking.
      # Its ticket is stapled to the app, so that holds offline too. Before the update's archive is
      # signed for Sparkle, so what's published is the stapled app.
      - name: Notarize
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if ! codesign -dv --verbose=2 build/Huddle.app 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            echo "::warning::Not signed with Developer ID, so not notarized: other Macs will ask before opening it."
            exit 0
          fi
          if [ -z "$NOTARY_API_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::warning::No NOTARY_API_KEY, NOTARY_KEY_ID or NOTARY_ISSUER_ID secret, so not notarized: other Macs will ask before opening it."
            exit 0
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$key"' EXIT
          echo "$NOTARY_API_KEY" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          ditto -c -k --keepParent build/Huddle.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" --wait --timeout 30m \
            --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          read -r id status < <(python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print(d.get("id", "-"), d.get("status", "-"))' "$RUNNER_TEMP/notary.json" || echo "- -")
          if [ "$status" != "Accepted" ]; then
            # Apple's reasons, for the log.
            if [ "$id" != "-" ]; then xcrun notarytool log "$id" "${auth[@]}" || true; fi
            echo "::error::Notarization didn't succeed: $status."
            exit 1
          fi
          xcrun stapler staple build/Huddle.app
          xcrun stapler validate build/Huddle.app
          spctl --assess --type execute -vv build/Huddle.app
          # The archive again, of the stapled app.
          rm -f "Huddle-$VERSION.zip"
          ditto -c -k --keepParent build/Huddle.app "Huddle-$VERSION.zip"

      - name: Keep the trial build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Huddle-${{ env.VERSION }}
          path: Huddle-${{ env.VERSION }}.zip
          retention-days: 3

      - name: Publish the update
        id: update
        if: github.event_name == 'push'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ] || [ -z "$GH_TOKEN" ]; then
            echo "::warning::No SPARKLE_PRIVATE_KEY or RELEASES_TOKEN secret: this release won't be offered as an update."
            exit 0
          fi
          # Only an app signed with a real certificate goes out as an update. One signed ad hoc (no
          # MACOS_CERTIFICATE_P12 secret) has no hardened runtime (build-app.sh), so another
          # program could load code into it and read its sessions from the Keychain.
          signature_info="$(codesign -dv --verbose=2 build/Huddle.app 2>&1)"
          if grep -q '^TeamIdentifier=not set' <<< "$signature_info" || ! grep -q '^CodeDirectory.*(runtime)' <<< "$signature_info"; then
            echo "::error::The app is signed ad hoc, without the hardened runtime: not publishing it as an update."
            exit 1
          fi
          version="$VERSION"
          zip="Huddle-$version.zip"
          build="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/Huddle.app/Contents/Info.plist)"
          signature="$(echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - -p "$zip")"
          length="$(stat -f %z "$zip")"
          beta="" prerelease=""
          case "$GITHUB_REF_NAME" in *-*) beta="--beta" prerelease="--prerelease" ;; esac

          # GitHub now and then fails a request (an HTTP 5xx, a timeout), sometimes one it carried out
          # all the same. So each step below is tried up to five times, and is safe to repeat: it looks
          # at what is there before it acts. (A function called like this doesn't stop at a failing
          # command by itself, hence the "|| return"s.)
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              [ "$attempt" = 5 ] && break
              echo "::warning::$1 failed (try $attempt of 5); trying again in $((attempt * 20)) s."
              sleep $((attempt * 20))
            done
            echo "::error::$1 failed five times."
            return 1
          }

          # A new public repository needs a first commit for the release's tag to point at.
          updates="$RUNNER_TEMP/updates"
          # The token reaches git through a helper that reads it from the environment when asked,
          # rather than in the address, where it would sit in .git/config and in the list of
          # running processes for the rest of the job. (Single quotes: "$GH_TOKEN" stays as it is
          # until the helper runs.) The empty helper first drops any other, like the keychain's.
          credentials='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          clone_updates() {
            rm -rf "$updates"
            git -c credential.helper= -c "credential.helper=$credentials" \
              clone -q "https://github.com/$UPDATES_REPO.git" "$updates" || return
            git -C "$updates" config credential.helper "" || return
            git -C "$updates" config --add credential.helper "$credentials" || return
            git -C "$updates" config user.name "github-actions[bot]" || return
            git -C "$updates" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }
          retry clone_updates
          if ! git -C "$updates" rev-parse -q --verify HEAD > /dev/null; then
            git -C "$updates" checkout -q -b main
            printf '# Huddle releases\n\nBuilds of Huddle, and the appcast the app checks for updates.\n' > "$updates/README.md"
            git -C "$updates" add README.md
            git -C "$updates" commit -q -m "Start the releases repository"
            git -C "$updates" push -q -u origin main
          fi

          # The release, with the archive. gh makes it as a draft, uploads to it and then publishes it,
          # so a try that failed partway can leave a draft behind: the archive then goes to that draft,
          # and the draft is published.
          publish_release() {
            local draft
            if ! draft="$(gh release view "$GITHUB_REF_NAME" -R "$UPDATES_REPO" --json isDraft -q .isDraft 2> "$RUNNER_TEMP/view.txt")"; then
              # Not there yet, rather than GitHub failing to say.
              grep -q 'release not found' "$RUNNER_TEMP/view.txt" || { cat "$RUNNER_TEMP/view.txt" >&2; return 1; }
              gh release create "$GITHUB_REF_NAME" "$zip" -R "$UPDATES_REPO" \
                --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
              return
            fi
            gh release upload "$GITHUB_REF_NAME" "$zip" -R "$UPDATES_REPO" --clobber || return
            # Its title and notes as the tag has them now (a run again after the message changed).
            gh release edit "$GITHUB_REF_NAME" -R "$UPDATES_REPO" \
              --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/notes.md" || return
            if [ "$draft" = true ]; then
              gh release edit "$GITHUB_REF_NAME" -R "$UPDATES_REPO" --draft=false
            fi
          }
          retry publish_release

          # Listed in the appcast only now, so nobody is offered an archive that isn't there yet. Made
          # from the appcast as it is on each try, so one another release has pushed meanwhile is kept.
          publish_appcast() {
            git -C "$updates" fetch -q origin || return
            git -C "$updates" reset -q --hard '@{upstream}' || return
            Scripts/appcast.py "$updates/appcast.xml" --version "$version" --build "$build" \
              --url "https://github.com/$UPDATES_REPO/releases/download/$GITHUB_REF_NAME/$zip" \
              --length "$length" --signature "$signature" --notes "$RUNNER_TEMP/notes.md" $beta || return
            git -C "$updates" add appcast.xml || return
            git -C "$updates" commit -q -m "Huddle $version" || return
            git -C "$updates" push -q origin HEAD
          }
          retry publish_appcast
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Only when the update wasn't published, for want of its secrets: the build is kept as a
      # release here instead, so it isn't lost.
      - name: Publish the release here
        if: github.event_name == 'push' && steps.update.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$VERSION"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Huddle-$version.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Huddle-$version.zip" --verify-tag \
              --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
          fi

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
