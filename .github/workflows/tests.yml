# Runs the tests (Tests/) on every push to the release branches and on pull requests to them:
# the Swift ones with swift test, and the release and build scripts' with Python.
#
# Matrix SDK: built from source as the release does (Scripts/build-sdk.sh), and cached under the
# same key. A cache made here, on main, is one every branch and tag can use, releases included; the
# first run after the SDK changes takes far longer than the rest.
#
# Nothing here is secret, and nothing is published: a pull request's run has no access to the
# release environment, and its token can only read.
name: Tests

on:
  push:
    branches: [main, legacy/macos-13]
  pull_request:
    branches: [main, legacy/macos-13]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Release and build scripts
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the scripts
        run: python3 -I -B Tests/scripts/test_scripts.py -v

  app:
    name: App
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Restore the Matrix SDK
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/MatrixRustSDK/MatrixSDKFFI.xcframework
            Vendor/MatrixRustSDK/Sources
          # The release's key (release.yml), so either can use what the other built.
          key: matrix-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-sdk.sh', 'Scripts/sdk-patches/**') }}

      - name: Build the Matrix SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          Scripts/build-sdk.sh

      # Only from a push: a pull request's would be kept for that pull request alone.
      - name: Keep the Matrix SDK
        if: steps.sdk.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/MatrixRustSDK/MatrixSDKFFI.xcframework
            Vendor/MatrixRustSDK/Sources
          key: ${{ steps.sdk.outputs.cache-primary-key }}

      - name: Test the app
        run: swift test
